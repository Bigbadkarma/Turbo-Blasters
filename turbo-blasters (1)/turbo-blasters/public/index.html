<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Turbo Blasters</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1028;color:white;font:600 16px system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;text-shadow:0 2px 5px #000}#menu{position:absolute;inset:0;background:#0b1028eb;display:grid;place-items:center;text-align:center;padding:20px}#panel{width:min(430px,100%);padding:28px;border:2px solid #32dfff;border-radius:24px;background:#182248;box-shadow:0 0 60px #11b8f744}h1{font-size:clamp(32px,8vw,52px);margin:0 0 12px;color:#ffce40}input,button{font:inherit;border:0;border-radius:14px;padding:14px}input{width:100%;text-transform:uppercase;text-align:center;margin:12px 0;background:#fff;color:#121936}button{background:#ffcf40;color:#172043;cursor:pointer;font-weight:900}#join{width:100%}#controls{position:absolute;bottom:22px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:#ffffff36;color:white;border:2px solid #ffffff90;font-size:26px;user-select:none;-webkit-user-select:none}#controls #fire{background:#ff477dba;width:96px;height:96px;font-size:17px}#controls .steer{display:flex;gap:10px;align-items:end}#dead{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);background:#131b3bee;padding:22px;border-radius:18px;text-align:center;display:none}small{opacity:.8}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="stats">Connecting…</span><span id="leader"></span></div><div id="controls"><div class="steer"><button data-key="left">◀</button><button data-key="right">▶</button></div><button id="fire" data-key="fire">FIRE</button></div><div id="dead"><h2>WRECKED!</h2><button id="restart">Race Again</button></div><div id="menu"><div id="panel"><h1>🏎️ TURBO BLASTERS</h1><p>Race, shoot rivals, and climb the leaderboard!</p><input id="room" maxlength="8" value="RACE" aria-label="Room code"><button id="join">JOIN ONLINE RACE</button><p><small>Share the room code with friends. Desktop: A/D or ←/→ to steer, Space to shoot.</small></p><p id="message"></p></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let state={players:[],bullets:[],tick:0},myId=null,code='';let W=innerWidth,H=innerHeight;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
document.querySelector('#join').onclick=()=>socket.emit('join',document.querySelector('#room').value);socket.on('joined',d=>{myId=d.id;code=d.code;document.querySelector('#menu').style.display='none'});socket.on('errorMessage',m=>document.querySelector('#message').textContent=m);socket.on('state',s=>{state=s;const me=s.players.find(p=>p.id===myId);if(me){document.querySelector('#stats').textContent=`ROOM ${code} | ❤️ ${me.hp} | ⭐ ${me.score} | 🎯 ${me.kills}`;document.querySelector('#dead').style.display=me.alive?'none':'block'}const leaders=[...s.players].sort((a,b)=>b.score-a.score);document.querySelector('#leader').textContent=leaders.length?`🏆 ${leaders[0].name}: ${leaders[0].score}`:''});document.querySelector('#restart').onclick=()=>socket.emit('restart');
const input={left:false,right:false,fire:false};function send(){socket.emit('input',input)}for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input[key]=true;send()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();input[key]=false;send()})}const keys={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'fire'};addEventListener('keydown',e=>{if(keys[e.code]){e.preventDefault();input[keys[e.code]]=true;send()}});addEventListener('keyup',e=>{if(keys[e.code]){input[keys[e.code]]=false;send()}});addEventListener('blur',()=>{Object.keys(input).forEach(k=>input[k]=false);send()});
function draw(){requestAnimationFrame(draw);ctx.fillStyle='#161d39';ctx.fillRect(0,0,W,H);const left=W*.12,right=W*.88,road=right-left;ctx.fillStyle='#343d59';ctx.fillRect(left,0,road,H);ctx.fillStyle='#e7f5ff';ctx.fillRect(left,0,5,H);ctx.fillRect(right-5,0,5,H);ctx.strokeStyle='#f8d94a';ctx.lineWidth=5;ctx.setLineDash([34,40]);ctx.lineDashOffset=-(state.tick*11)%74;for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(left+road*i/3,0);ctx.lineTo(left+road*i/3,H);ctx.stroke()}ctx.setLineDash([]);for(const p of state.players){if(!p.alive)continue;const x=left+p.x*road,y=p.y*H,cw=Math.min(46,road*.16),ch=64;ctx.save();ctx.translate(x,y);ctx.fillStyle='#080e21';ctx.fillRect(-cw*.65,-ch*.3,cw*.18,ch*.24);ctx.fillRect(cw*.47,-ch*.3,cw*.18,ch*.24);ctx.fillRect(-cw*.65,ch*.22,cw*.18,ch*.24);ctx.fillRect(cw*.47,ch*.22,cw*.18,ch*.24);ctx.fillStyle=p.color;ctx.fillRect(-cw/2,-ch/2,cw,ch);ctx.fillStyle='#a6edff';ctx.fillRect(-cw*.35,-ch*.22,cw*.7,ch*.23);ctx.fillStyle='#fff';ctx.fillRect(-cw*.34,-ch*.48,cw*.22,6);ctx.fillRect(cw*.12,-ch*.48,cw*.22,6);ctx.restore();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(p.id===myId?'YOU':p.name,x,y-49);ctx.fillStyle='#ff496f';ctx.fillRect(x-25,y-44,50,5);ctx.fillStyle='#51ef91';ctx.fillRect(x-25,y-44,p.hp/2,5)}for(const b of state.bullets){ctx.fillStyle='#ffdc4d';ctx.beginPath();ctx.arc(left+b.x*road,b.y*H,6,0,Math.PI*2);ctx.fill()} }draw();
</script></body></html>
